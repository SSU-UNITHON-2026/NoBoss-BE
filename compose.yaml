services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: noboss
      POSTGRES_USER: noboss
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - noboss-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/noboss
      DB_USERNAME: noboss
      DB_PASSWORD: ${DB_PASSWORD}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-https://web-production-dc097.up.railway.app}
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-3s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-30s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    ports:
      - "127.0.0.1:18081:8080"

volumes:
  noboss-postgres-data:
