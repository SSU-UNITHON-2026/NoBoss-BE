# 공통(개발/배포) 설정 파일
spring:
  application:
    name: unithon

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    validate-migration-naming: true

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

ai:
  service:
    url: ${AI_SERVICE_URL:https://web-production-dc097.up.railway.app}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:30s}
